<svg width="340" height="72" viewBox="0 0 340 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="nm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="25%" stop-color="#e6be53"/>
      <stop offset="50%" stop-color="#c99726"/>
      <stop offset="75%" stop-color="#a67313"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    
    <!-- Royal Crimson Accent Gradient -->
    <linearGradient id="nm-ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c99726" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Luxury Crest / Emblem -->
  <g transform="translate(6, 6)" filter="url(#gold-glow)">
    <!-- Outer Shield / Circle with Royal Border -->
    <circle cx="30" cy="30" r="28" fill="#111827" stroke="url(#nm-gold)" stroke-width="2"/>
    <circle cx="30" cy="30" r="25" fill="none" stroke="url(#nm-gold)" stroke-width="0.75" stroke-dasharray="2 2"/>
    
    <!-- Crown on Top -->
    <path d="M22 20 L24 24 L30 18 L36 24 L38 20 L37 27 L23 27 Z" fill="url(#nm-gold)"/>
    <circle cx="22" cy="19" r="1" fill="#fff"/>
    <circle cx="30" cy="17" r="1.2" fill="#fff"/>
    <circle cx="38" cy="19" r="1" fill="#fff"/>
    
    <!-- Monogram Letters NM -->
    <text x="30" y="42" fill="url(#nm-gold)" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">NM</text>
    
    <!-- Small Bottom Ruby Gem -->
    <polygon points="30,47 32,49 30,51 28,49" fill="url(#nm-ruby)"/>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(74, 8)">
    <!-- Main Brand Name -->
    <text x="0" y="27" fill="#111827" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="900" letter-spacing="0.08em">
      NEHA <tspan fill="url(#nm-ruby)">MAM</tspan>
    </text>

    <!-- Badge / Subtitle -->
    <text x="1" y="45" fill="url(#nm-gold)" font-family="'Poppins', 'Montserrat', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.22em">
      UDAIPUR ESCORT SERVICE
    </text>
    
    <!-- Micro Tagline -->
    <text x="1" y="56" fill="#64748b" font-family="'Poppins', 'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.14em">
      VERIFIED • 100% COD • 24X7
    </text>
  </g>
</svg>
