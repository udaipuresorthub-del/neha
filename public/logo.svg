<svg width="340" height="72" viewBox="0 0 340 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="nm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="nm-crest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a253c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffd700" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Luxury Crest / Emblem -->
  <g transform="translate(6, 6)" filter="url(#gold-glow)">
    <!-- Outer Shield / Circle with Royal Border -->
    <circle cx="30" cy="30" r="28" fill="url(#nm-crest-bg)" stroke="url(#nm-gold)" stroke-width="2.2"/>
    <circle cx="30" cy="30" r="24.5" fill="none" stroke="url(#nm-gold)" stroke-width="0.8" stroke-dasharray="2.5 2"/>
    
    <!-- Crown on Top -->
    <path d="M22 20 L24 24 L30 18 L36 24 L38 20 L37 27 L23 27 Z" fill="url(#nm-gold)"/>
    <circle cx="22" cy="19" r="1.2" fill="#ffffff"/>
    <circle cx="30" cy="17" r="1.5" fill="#ffffff"/>
    <circle cx="38" cy="19" r="1.2" fill="#ffffff"/>
    
    <!-- Monogram Letters NM in Crisp Pure White -->
    <text x="30" y="42" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">NM</text>
    
    <!-- Small Bottom Gem in Gold -->
    <polygon points="30,47 32,49 30,51 28,49" fill="url(#nm-gold)"/>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(74, 8)">
    <!-- Main Brand Name in Crisp Pure White -->
    <text x="0" y="27" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="900" letter-spacing="0.08em">
      NEHA <tspan fill="#ffffff">MAM</tspan>
    </text>

    <!-- Subtitle in Vibrant Bright Gold -->
    <text x="1" y="45" fill="url(#nm-gold)" font-family="'Poppins', 'Montserrat', sans-serif" font-size="10" font-weight="800" letter-spacing="0.22em">
      UDAIPUR ESCORT SERVICE
    </text>
    
    <!-- Micro Tagline in Clean Crisp White/Light Slate -->
    <text x="1" y="56" fill="#e2e8f0" font-family="'Poppins', 'Inter', sans-serif" font-size="7.8" font-weight="700" letter-spacing="0.16em">
      VERIFIED • 100% COD • 24X7
    </text>
  </g>
</svg>
